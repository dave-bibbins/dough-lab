<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Dough Lab</title>
<!-- PWA / iPad home-screen. These relative refs 404 harmlessly on local file:// and resolve only when hosted. -->
<meta name="theme-color" content="#1C1A17" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Dough Lab" />
<link rel="manifest" href="manifest.webmanifest" />
<script>
  // Offline support only matters when served (not file://); register defensively.
  if('serviceWorker' in navigator && location.protocol.startsWith('http')){
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
  }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1C1A17;
    --panel:#242019;
    --panel-2:#2B2620;
    --line:#3B3427;
    --text:#EDE6D6;
    --text-dim:#A89C86;
    --gold:#C89B3C;
    --gold-bright:#E3BA63;
    --crust:#B36A3C;
    --paper:#F2E9D6;
    --paper-ink:#2B2419;
    --paper-dim:#7A6E58;
    --good:#7FA06F;
    --bad:#C97A5D;
    --radius:7px;
  }
  *{box-sizing:border-box;}
  input[type=number]{ -moz-appearance:textfield; appearance:textfield; }
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  body{
    margin:0;
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(200,155,60,0.08), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .shell{max-width:1080px;margin:0 auto;padding:36px 20px 60px;}

  header{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:28px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand svg{flex:none;}
  h1{
    font-family:'Fraunces',serif;
    font-optical-sizing:auto;
    font-weight:700;
    font-size:34px;
    margin:0;
    letter-spacing:-0.01em;
    color:var(--text);
  }
  .tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--gold);
    margin-top:2px;
  }

  .tabs{display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px;}
  .tabs button{
    font-family:'Inter';font-weight:600;font-size:13.5px;
    border:none;background:transparent;color:var(--text-dim);
    padding:9px 18px;border-radius:999px;cursor:pointer;
    transition:background .15s, color .15s;
  }
  .tabs button.active{background:var(--gold);color:#20180a;}

  .grid{display:grid;grid-template-columns:1.05fr 0.95fr;gap:22px;align-items:start;}
  .grid.solo-view{grid-template-columns:1fr;}
  @media (max-width:860px){.grid{grid-template-columns:1fr;}}

  .view-hidden{display:none !important;}

  /* ---------- header actions + New menu (library shell) ---------- */
  .header-actions{display:flex;align-items:center;gap:10px;}
  .new-wrap{position:relative;}
  .new-menu{
    position:absolute;top:calc(100% + 6px);right:0;z-index:60;
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:6px;min-width:190px;box-shadow:0 10px 28px rgba(0,0,0,.4);
  }
  .new-menu button{
    display:block;width:100%;text-align:left;background:transparent;border:none;
    color:var(--text);font-family:'Inter';font-weight:500;font-size:13.5px;
    padding:9px 11px;border-radius:5px;cursor:pointer;
  }
  .new-menu button:hover{background:var(--panel-2);color:var(--gold-bright);}
  .new-menu .nm-divider{height:1px;background:var(--line);margin:5px 6px;}

  /* ---------- library home ---------- */
  .lib-view{max-width:840px;margin:0 auto;}
  .lib-section + .lib-section{margin-top:32px;}
  .lib-cards{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));
    gap:12px;margin-top:14px;
  }
  .lib-card{
    position:relative;background:var(--panel);border:1px solid var(--line);
    border-radius:var(--radius);padding:16px 16px 15px;cursor:pointer;
    transition:border-color .15s, transform .1s;
  }
  .lib-card:hover{border-color:var(--gold);}
  .lib-card:active{transform:translateY(1px);}
  .lib-card .nm{
    font-family:'Fraunces',serif;font-weight:600;font-size:16px;color:var(--text);
    display:block;padding-right:24px;line-height:1.25;
  }
  .lib-card .sub{
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.05em;
    color:var(--text-dim);margin-top:7px;text-transform:uppercase;
  }
  .lib-card .del{
    position:absolute;top:9px;right:9px;width:22px;height:22px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    color:var(--text-dim);font-size:13px;line-height:1;opacity:0;transition:opacity .15s, background .15s, color .15s;
  }
  .lib-card:hover .del{opacity:1;}
  .lib-card .del:hover{background:var(--crust);color:#fff;}

  /* ---------- library search (the index field) ---------- */
  .lib-toolbar{margin-bottom:26px;}
  .lib-search{position:relative;display:flex;align-items:center;}
  .lib-search .mag{
    position:absolute;left:13px;font-size:14px;color:var(--text-dim);
    pointer-events:none;line-height:1;
  }
  .lib-search input{
    width:100%;background:var(--panel-2);border:1px solid var(--line);
    border-radius:var(--radius);color:var(--text);
    font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.02em;
    padding:11px 40px 11px 34px;transition:border-color .15s, box-shadow .15s;
  }
  .lib-search input::placeholder{color:var(--text-dim);letter-spacing:.04em;}
  .lib-search input:focus{
    outline:none;border-color:var(--gold);
    box-shadow:0 0 0 3px rgba(200,155,60,.16);
  }
  .lib-search .clear{
    position:absolute;right:9px;width:22px;height:22px;border-radius:50%;
    display:none;align-items:center;justify-content:center;cursor:pointer;
    color:var(--text-dim);font-size:13px;line-height:1;background:transparent;border:none;
  }
  .lib-search.has-q .clear{display:flex;}
  .lib-search .clear:hover{background:var(--panel);color:var(--text);}
  .lib-count{
    font-family:'IBM Plex Mono',monospace;text-transform:none;letter-spacing:.04em;
    font-size:11px;font-weight:500;color:var(--text-dim);
  }

  /* ---------- empty / no-result states ---------- */
  .lib-empty{
    grid-column:1/-1;border:1px dashed var(--line);border-radius:var(--radius);
    padding:26px 20px;text-align:center;
  }
  .lib-empty .em-h{
    font-family:'Fraunces',serif;font-weight:600;font-size:16px;color:var(--text-dim);
  }
  .lib-empty .em-sub{
    font-family:'Inter';font-size:12.5px;color:var(--text-dim);
    margin-top:6px;line-height:1.5;
  }
  .lib-empty .em-act{
    display:inline-block;margin-top:14px;font-family:'Inter';font-weight:600;font-size:12.5px;
    color:var(--gold-bright);cursor:pointer;border:1px solid var(--line);
    padding:7px 14px;border-radius:5px;transition:border-color .15s, color .15s;
  }
  .lib-empty .em-act:hover{border-color:var(--gold);color:var(--gold);}

  /* ---------- tags: filter pills (library) + card chips ---------- */
  .tag-pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;}
  .tag-pill{
    font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.03em;
    color:var(--text-dim);background:var(--panel-2);border:1px solid var(--line);
    border-radius:999px;padding:5px 12px;cursor:pointer;
    transition:border-color .15s, color .15s, background .15s;
  }
  .tag-pill:hover{border-color:var(--gold);color:var(--text);}
  .tag-pill.active{background:var(--gold);border-color:var(--gold);color:#241f16;font-weight:600;}
  .lib-card .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .card-tag{
    font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.02em;
    color:var(--text-dim);background:var(--panel-2);border-radius:4px;padding:2px 7px;
  }

  /* ---------- tags: editor (detail views) ---------- */
  .tag-edit{margin-top:10px;}
  .tag-edit .te-chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  .te-chip{
    display:inline-flex;align-items:center;gap:5px;
    font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text);
    background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:3px 5px 3px 10px;
  }
  .te-chip .x{
    width:15px;height:15px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    color:var(--text-dim);font-size:11px;line-height:1;cursor:pointer;
  }
  .te-chip .x:hover{background:var(--crust);color:#fff;}
  .te-input{
    flex:1;min-width:120px;background:transparent;border:none;color:var(--text);
    font-family:'IBM Plex Mono',monospace;font-size:12px;padding:4px 2px;
  }
  .te-input:focus{outline:none;}
  .te-input::placeholder{color:var(--text-dim);}
  .te-sug{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .te-sug .s{
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--text-dim);
    border:1px dashed var(--line);border-radius:999px;padding:3px 9px;cursor:pointer;
  }
  .te-sug .s:hover{border-color:var(--gold);color:var(--text);border-style:solid;}

  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:22px 22px 20px;
  }
  .panel + .panel{margin-top:18px;}

  .section-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--gold-bright);
    margin:0 0 14px;
    display:flex;align-items:center;gap:8px;
  }
  .section-label::after{content:"";flex:1;height:1px;background:var(--line);}
  .section-label .mini-btn{
    font-family:'Inter';text-transform:none;letter-spacing:0;font-size:11.5px;font-weight:600;
    color:var(--gold-bright);background:none;border:none;cursor:pointer;padding:0;
  }
  .section-label .mini-btn:hover{color:var(--gold);text-decoration:underline;}

  .field{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--line);}
  .field:last-child{border-bottom:none;}
  .field label{font-size:13.5px;color:var(--text);}
  .field .hint{display:block;font-size:11px;color:var(--text-dim);margin-top:1px;}
  .field .inp-wrap{display:flex;align-items:center;gap:6px;flex:none;}
  .field input[type=number]{
    width:74px;background:var(--panel-2);border:1px solid var(--line);color:var(--text);
    font-family:'IBM Plex Mono',monospace;font-size:14px;text-align:right;
    padding:7px 8px;border-radius:5px;
  }
  .field input[type=number]:focus{outline:none;border-color:var(--gold);}
  .field .unit{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text-dim);width:16px;}
  select{
    background:var(--panel-2);border:1px solid var(--line);color:var(--text);
    font-family:'Inter';font-size:13px;padding:7px 8px;border-radius:5px;
  }
  select:focus{outline:none;border-color:var(--gold);}

  .toggle-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;}
  .switch{position:relative;width:38px;height:21px;flex:none;}
  .switch input{opacity:0;width:0;height:0;}
  .switch .slider{position:absolute;inset:0;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;cursor:pointer;transition:.15s;}
  .switch .slider::before{content:"";position:absolute;width:15px;height:15px;left:2px;top:2px;background:var(--text-dim);border-radius:50%;transition:.15s;}
  .switch input:checked + .slider{background:rgba(200,155,60,0.25);border-color:var(--gold);}
  .switch input:checked + .slider::before{transform:translateX(17px);background:var(--gold-bright);}

  .subfields.hidden{display:none;}
  .inp-wrap-inline{display:flex;align-items:center;gap:6px;}
  .mini-num{
    width:60px;background:var(--panel-2);border:1px solid var(--line);color:var(--text);
    font-family:'IBM Plex Mono',monospace;font-size:14px;text-align:right;
    padding:7px 8px;border-radius:5px;
  }
  .mini-num:focus{outline:none;border-color:var(--gold);}
  .mini-unit{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text-dim);}

  .scale-row{display:flex;gap:12px;}
  .scale-row .field{flex:1;border-bottom:none;padding:6px 0;}

  /* extras (dynamic ingredient rows) */
  .extra-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);}
  .extra-row:last-of-type{border-bottom:none;}
  .extra-row input[type=text]{
    flex:1;background:var(--panel-2);border:1px solid var(--line);color:var(--text);
    font-family:'Inter';font-size:13px;padding:7px 9px;border-radius:5px;min-width:0;
  }
  .extra-row input[type=text]:focus{outline:none;border-color:var(--gold);}
  .extra-row input[type=number]{
    width:64px;background:var(--panel-2);border:1px solid var(--line);color:var(--text);
    font-family:'IBM Plex Mono',monospace;font-size:14px;text-align:right;
    padding:7px 8px;border-radius:5px;
  }
  .extra-row input[type=number]:focus{outline:none;border-color:var(--gold);}
  .extra-row .unit{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text-dim);}
  .extra-row .rm{
    width:22px;height:22px;flex:none;border-radius:50%;border:1px solid var(--line);background:none;
    color:var(--text-dim);cursor:pointer;font-size:12px;line-height:1;
  }
  .extra-row .rm:hover{border-color:var(--crust);color:var(--crust);}
  .add-extra{
    margin-top:10px;font-family:'Inter';font-weight:600;font-size:12.5px;
    background:none;border:1px dashed var(--line);color:var(--text-dim);
    padding:8px;border-radius:5px;cursor:pointer;width:100%;
  }
  .add-extra:hover{border-color:var(--gold);color:var(--gold-bright);}

  textarea{
    width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--text);
    font-family:'Inter';font-size:13px;line-height:1.55;padding:10px;border-radius:5px;
    resize:vertical;min-height:90px;
  }
  textarea:focus{outline:none;border-color:var(--gold);}

  .flour-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:9px 0;}
  .flour-auto-btn{
    font-family:'Inter';font-weight:600;font-size:11px;letter-spacing:.02em;
    background:var(--panel-2);border:1px solid var(--line);color:var(--gold-bright);
    padding:5px 11px;border-radius:999px;cursor:pointer;
  }
  .flour-auto-btn:hover{border-color:var(--gold);}
  .flour-auto-btn:disabled{color:var(--text-dim);opacity:.55;cursor:default;}
  .flour-auto-btn:disabled:hover{border-color:var(--line);}

  /* TICKET */
  .ticket-wrap{position:sticky;top:20px;}
  .ticket{
    background:var(--paper);
    color:var(--paper-ink);
    border-radius:3px;
    padding:26px 24px 22px;
    font-family:'IBM Plex Mono',monospace;
    box-shadow:0 18px 40px -12px rgba(0,0,0,0.55);
    position:relative;
  }
  .ticket-title{font-family:'Fraunces',serif;font-weight:700;font-size:20px;letter-spacing:-0.01em;margin:0 0 2px;}
  .ticket-sub{font-size:11px;color:var(--paper-dim);letter-spacing:.03em;margin-bottom:14px;}
  .ticket-sub b{color:var(--crust);}
  .perf{
    height:9px;margin:14px -24px;
    background-image:radial-gradient(circle, var(--bg) 2.4px, transparent 2.6px);
    background-size:15px 100%;
    background-position:7.5px 0;
  }
  .line-item{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;padding:3.5px 0;}
  .line-item .name{color:var(--paper-ink);}
  .line-item .dots{flex:1;border-bottom:1px dotted var(--paper-dim);margin:0 6px;transform:translateY(-3px);}
  .line-item .amt{font-weight:600;white-space:nowrap;}
  .line-item.sub .name{color:var(--paper-dim);padding-left:12px;font-style:italic;}
  .group-heading{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--crust);margin:14px 0 4px;font-weight:600;}
  .group-heading:first-child{margin-top:0;}
  .total-row{display:flex;justify-content:space-between;font-size:16px;font-weight:700;padding-top:10px;margin-top:4px;border-top:2px solid var(--paper-ink);}
  .method{font-size:11.5px;line-height:1.6;color:var(--paper-ink);margin-top:4px;white-space:pre-wrap;}
  .method b{color:var(--crust);}
  .method-block{margin-top:10px;}
  .method-title{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--crust);margin-bottom:4px;font-weight:600;}

  .save-row{display:flex;gap:8px;margin-top:16px;}
  .save-row input[type=text]{
    flex:1;background:var(--panel-2);border:1px solid var(--line);color:var(--text);
    font-family:'Inter';font-size:13px;padding:9px 10px;border-radius:5px;
  }
  .save-row input[type=text]:focus{outline:none;border-color:var(--gold);}
  .btn{
    font-family:'Inter';font-weight:600;font-size:13px;
    background:var(--gold);color:#20180a;border:none;border-radius:5px;
    padding:9px 16px;cursor:pointer;white-space:nowrap;
  }
  .btn:hover{background:var(--gold-bright);}

  .presets{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
  .preset-chip{
    display:flex;align-items:center;gap:7px;
    background:var(--panel-2);border:1px solid var(--line);border-radius:999px;
    padding:6px 8px 6px 13px;font-size:12.5px;cursor:pointer;color:var(--text);
  }
  .preset-chip:hover{border-color:var(--gold);}
  .preset-chip .x{
    width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    color:var(--text-dim);font-size:12px;line-height:1;
  }
  .preset-chip .x:hover{background:var(--crust);color:#fff;}
  .empty-note{font-size:12px;color:var(--text-dim);margin-top:10px;}
  .save-msg{font-size:11.5px;color:var(--good);margin-top:6px;height:14px;}

  .autosave-badge{
    position:fixed;right:18px;bottom:18px;z-index:50;
    font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.02em;
    background:var(--panel);border:1px solid var(--line);color:var(--text-dim);
    padding:7px 14px;border-radius:999px;
    opacity:0;transform:translateY(4px);pointer-events:none;
    transition:opacity .2s, transform .2s;
    box-shadow:0 10px 24px -8px rgba(0,0,0,0.55);
  }
  .autosave-badge.show{opacity:1;transform:translateY(0);}
  .autosave-badge.ok{color:var(--good);border-color:var(--good);}
  .autosave-badge.warn{color:var(--gold-bright);border-color:var(--gold);}
  .autosave-badge.error{color:var(--bad);border-color:var(--crust);}

  /* Always-on persistence indicator in the header (primary save-state signal) */
  .save-chip{
    display:inline-flex;align-items:center;gap:7px;
    font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.02em;
    background:var(--panel);border:1px solid var(--line);color:var(--text-dim);
    padding:6px 11px;border-radius:999px;cursor:pointer;white-space:nowrap;
    transition:color .2s,border-color .2s;
  }
  .save-chip:hover{border-color:var(--gold);}
  .save-chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none;}
  .save-chip.ok{color:var(--good);border-color:color-mix(in srgb, var(--good) 45%, var(--line));}
  .save-chip.saving{color:var(--gold-bright);border-color:var(--gold);}
  .save-chip.saving .dot{animation:chip-pulse 1s ease-in-out infinite;}
  .save-chip.warn{color:var(--gold-bright);border-color:var(--gold);}
  .save-chip.danger{color:var(--bad);border-color:var(--bad);}
  @keyframes chip-pulse{0%,100%{opacity:1;}50%{opacity:.25;}}

  /* Data File panel detail (filename / last-saved / location note) */
  .datafile-detail{font-size:12px;color:var(--text-dim);line-height:1.5;margin-top:10px;}
  .datafile-detail b{color:var(--text);font-weight:600;}
  .datafile-detail .df-note{color:var(--text-dim);opacity:.85;font-size:11.5px;}
  .datafile-status.warn{color:var(--gold-bright);}
  .datafile-status.danger{color:var(--bad);}

  .ticket-toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:10px;}
  .line-cost-toggle{display:flex;align-items:center;gap:8px;font-family:'Inter';font-weight:600;font-size:12.5px;color:var(--text-dim);}

  .print-btn{
    display:flex;align-items:center;gap:7px;
    font-family:'Inter';font-weight:600;font-size:12.5px;
    background:var(--panel);border:1px solid var(--line);color:var(--text-dim);
    padding:8px 14px;border-radius:999px;cursor:pointer;
  }
  .print-btn:hover{border-color:var(--gold);color:var(--gold-bright);}
  .print-btn svg{flex:none;}
  .toolbar-btns{display:flex;gap:8px;}

  /* ---------- bench view: fullscreen, locked, trimmed recipe card for the countertop ---------- */
  .bench-exit{display:none;}
  body.bench{overflow:hidden;}
  body.bench .shell > header,
  body.bench .col-inputs,
  body.bench .ticket-toolbar,
  body.bench .autosave-badge{display:none !important;}
  body.bench .grid{display:block;}
  body.bench .shell{max-width:none;margin:0;padding:0;}
  body.bench .col-ticket{
    position:fixed;inset:0;z-index:300;
    background:radial-gradient(ellipse 1100px 700px at 20% -10%, rgba(200,155,60,0.10), transparent 60%), var(--bg);
    display:flex;align-items:center;justify-content:center;
    padding:clamp(14px,3vw,44px);
  }
  body.bench .ticket-wrap{position:static;width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
  body.bench .ticket{
    width:min(1000px,96vw);max-height:96vh;overflow-y:auto;overflow-x:hidden;
    padding:clamp(24px,4vw,60px);border-radius:6px;
    box-shadow:0 30px 70px -14px rgba(0,0,0,0.75);
  }
  /* trim at the bench: no costs, no yeast note — just the formula + method */
  body.bench .cost-row,
  body.bench .yeast-note,
  body.bench .line-item .line-cost{display:none !important;}
  /* type sized to the viewport so it fills the propped-up device */
  body.bench .ticket-title{font-size:clamp(30px,5.5vw,62px);margin-bottom:clamp(2px,0.6vw,6px);}
  body.bench .ticket-sub{font-size:clamp(14px,2.3vw,26px);margin-bottom:clamp(10px,1.8vw,20px);}
  body.bench .perf{margin:clamp(14px,2.4vw,28px) 0;}
  body.bench .group-heading{font-size:clamp(13px,1.9vw,23px);margin:clamp(14px,2.4vw,28px) 0 clamp(4px,1vw,10px);}
  body.bench .line-item{font-size:clamp(20px,3.4vw,44px);padding:clamp(4px,1vw,10px) 0;}
  body.bench .total-row{font-size:clamp(24px,4vw,50px);padding-top:clamp(10px,1.6vw,20px);margin-top:clamp(4px,1vw,10px);}
  body.bench .method-title{font-size:clamp(13px,1.9vw,23px);margin-top:clamp(12px,2vw,22px);}
  body.bench .method{font-size:clamp(16px,2.6vw,32px);line-height:1.5;}
  /* recipe card scaled up at the bench too */
  body.bench .rc-temp{font-size:clamp(14px,2.3vw,26px);}
  body.bench .rc-section{font-size:clamp(13px,1.9vw,23px);margin:clamp(14px,2.4vw,28px) 0 clamp(4px,1vw,10px);}
  body.bench .rc-ing{font-size:clamp(19px,3.2vw,42px);padding:clamp(4px,1vw,10px) 0;}
  body.bench .rc-ing .amt{min-width:clamp(90px,13vw,170px);}
  body.bench .rc-ing .body .nt{font-size:0.62em;}
  body.bench .rc-equip,body.bench .rc-yield{font-size:clamp(17px,2.9vw,38px);padding:clamp(3px,0.8vw,8px) 0;}
  body.bench .rc-step{font-size:clamp(16px,2.6vw,32px);padding:clamp(5px,1.2vw,12px) 0;line-height:1.45;}
  body.bench .bench-exit{
    display:flex;align-items:center;gap:8px;
    position:fixed;top:16px;right:16px;z-index:310;
    font-family:'Inter';font-weight:700;font-size:15px;
    background:var(--gold);color:#20180a;border:none;border-radius:999px;
    padding:12px 22px;cursor:pointer;box-shadow:0 8px 24px -6px rgba(0,0,0,0.6);
  }
  body.bench .bench-exit:hover{background:var(--gold-bright);}

  /* pantry (global ingredient pricing) */
  .pantry-row{padding:10px 0;border-bottom:1px solid var(--line);}
  .pantry-row:last-of-type{border-bottom:none;}
  .pantry-row-top{display:flex;align-items:center;gap:8px;}
  .pantry-row-top input[type=text]{
    flex:1;background:var(--panel-2);border:1px solid var(--line);color:var(--text);
    font-family:'Inter';font-size:13px;padding:7px 9px;border-radius:5px;min-width:0;
  }
  .pantry-row-top input[type=text]:focus{outline:none;border-color:var(--gold);}
  .pantry-row-bottom{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap;}
  .pantry-row-bottom input[type=number]{
    width:64px;background:var(--panel-2);border:1px solid var(--line);color:var(--text);
    font-family:'IBM Plex Mono',monospace;font-size:14px;text-align:right;
    padding:7px 8px;border-radius:5px;
  }
  .pantry-row-bottom input[type=number]:focus{outline:none;border-color:var(--gold);}
  .pantry-at{font-size:12px;color:var(--text-dim);}
  .pantry-dollar{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--text-dim);}
  .pantry-rate{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--gold-bright);white-space:nowrap;}
  .add-pantry{
    margin-top:10px;font-family:'Inter';font-weight:600;font-size:12.5px;
    background:none;border:1px dashed var(--line);color:var(--text-dim);
    padding:8px;border-radius:5px;cursor:pointer;width:100%;
  }
  .add-pantry:hover{border-color:var(--gold);color:var(--gold-bright);}
  .pantry-add-row{display:flex;gap:8px;}
  .pantry-add-row .add-pantry{margin-top:10px;width:auto;flex:1;}

  /* compound pantry item (priced from component ingredients) */
  .pantry-row.compound{border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:6px;padding:10px 12px;margin:8px 0;background:rgba(200,155,60,0.05);}
  .compound-tag{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-bright);border:1px solid var(--line);border-radius:999px;padding:2px 8px;white-space:nowrap;}
  .pantry-group-label{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-bright);margin:18px 0 10px;display:flex;align-items:center;gap:10px;}
  .pantry-group-label::before,.pantry-group-label::after{content:"";flex:1;height:1px;background:var(--line);}
  .comp-list{margin:8px 0;display:flex;flex-direction:column;gap:6px;}
  .comp-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .comp-row input[type=text]{flex:1;min-width:110px;background:var(--panel-2);border:1px solid var(--line);color:var(--text);font-family:'Inter';font-size:12.5px;padding:6px 8px;border-radius:5px;}
  .comp-row input[type=number]{width:56px;background:var(--panel-2);border:1px solid var(--line);color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:13px;text-align:right;padding:6px 7px;border-radius:5px;}
  .comp-row input:focus{outline:none;border-color:var(--gold);}
  .comp-row select{font-size:12px;padding:6px;}
  .comp-x,.comp-ea{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text-dim);}

  /* pantry-name autocomplete dropdown */
  .ac-menu{
    position:absolute;z-index:200;
    background:var(--panel-2);border:1px solid var(--gold);border-radius:6px;
    box-shadow:0 14px 32px -10px rgba(0,0,0,0.7);
    max-height:210px;overflow-y:auto;padding:4px;
  }
  .ac-menu.hidden{display:none;}
  .ac-item{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:7px 10px;border-radius:4px;cursor:pointer;
    font-family:'Inter';font-size:13px;color:var(--text);
  }
  .ac-item .ac-rate{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-dim);white-space:nowrap;}
  .ac-item.active,.ac-item:hover{background:rgba(200,155,60,0.2);}
  .comp-row .cp-rm{width:20px;height:20px;flex:none;border-radius:50%;border:1px solid var(--line);background:none;color:var(--text-dim);cursor:pointer;font-size:11px;line-height:1;}
  .comp-row .cp-rm:hover{border-color:var(--crust);color:var(--crust);}
  .add-comp{font-family:'Inter';font-weight:600;font-size:11.5px;background:none;border:1px dashed var(--line);color:var(--text-dim);padding:6px;border-radius:5px;cursor:pointer;width:100%;}
  .add-comp:hover{border-color:var(--gold);color:var(--gold-bright);}
  .compound-summary{margin-top:8px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--text-dim);}
  .compound-summary b{color:var(--gold-bright);}

  /* data file connection */
  .datafile-status{font-size:12.5px;color:var(--text-dim);line-height:1.5;}
  .datafile-status b{color:var(--good);}
  .datafile-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
  .btn-secondary{
    font-family:'Inter';font-weight:600;font-size:12.5px;
    background:var(--panel-2);color:var(--text);border:1px solid var(--line);border-radius:5px;
    padding:8px 14px;cursor:pointer;white-space:nowrap;
  }
  .btn-secondary:hover{border-color:var(--gold);color:var(--gold-bright);}

  /* ticket cost line */
  .cost-row{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:var(--paper-dim);margin-top:6px;}
  .cost-row .amt{font-weight:700;color:var(--paper-ink);}
  .cost-row .per{font-weight:400;color:var(--paper-dim);margin-left:4px;}
  .line-item .line-cost{font-weight:400;color:var(--paper-dim);font-size:0.85em;}

  /* finished pie assembly cost */
  .assembly-summary{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);}
  .assembly-line{display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--text-dim);padding:3px 0;}
  .assembly-line.sub{padding-left:10px;font-size:12px;}
  .assembly-line.total{font-weight:700;color:var(--gold-bright);border-top:1px solid var(--line);margin-top:6px;padding-top:8px;font-size:14px;}

  /* ---------- recipe box ---------- */
  .recipes-layout{display:grid;grid-template-columns:1.05fr 0.95fr;gap:22px;align-items:start;}
  @media (max-width:860px){.recipes-layout{grid-template-columns:1fr;}}
  .recipe-chips{display:flex;flex-wrap:wrap;gap:8px;}
  .recipe-chip{display:flex;align-items:center;gap:7px;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:6px 8px 6px 13px;font-size:12.5px;cursor:pointer;color:var(--text);}
  .recipe-chip:hover{border-color:var(--gold);}
  .recipe-chip.active{border-color:var(--gold);color:var(--gold-bright);background:rgba(200,155,60,0.12);}
  .recipe-chip .x{width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:12px;line-height:1;}
  .recipe-chip .x:hover{background:var(--crust);color:#fff;}
  /* Name reads as a title at rest; only shows input chrome on hover/focus (click to edit) */
  .rec-name-input{width:100%;background:transparent;border:1px solid transparent;color:var(--text);font-family:'Fraunces',serif;font-weight:600;font-size:23px;padding:6px 10px;border-radius:6px;transition:background .12s, border-color .12s;cursor:text;}
  .rec-name-input::placeholder{color:var(--text-dim);}
  .rec-name-input:hover{background:var(--panel-2);border-color:var(--line);}
  .rec-name-input:focus{background:var(--panel-2);border-color:var(--gold);outline:none;}
  .rec-temp-row{display:flex;align-items:center;gap:8px;margin-top:12px;}
  .rec-temp-row input{width:80px;background:var(--panel-2);border:1px solid var(--line);color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:14px;text-align:right;padding:7px 8px;border-radius:5px;}
  .rec-row{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .rec-row:last-of-type{border-bottom:none;}
  .rec-row input,.rec-row select{background:var(--panel-2);border:1px solid var(--line);color:var(--text);font-family:'Inter';font-size:13px;padding:7px 8px;border-radius:5px;min-width:0;}
  .rec-row input:focus,.rec-row select:focus,.rec-step textarea:focus{outline:none;border-color:var(--gold);}
  .rec-amt{width:52px;text-align:right;font-family:'IBM Plex Mono',monospace !important;}
  .rec-unit{font-size:12px;padding:7px 5px;}
  .rec-iname{flex:2;min-width:120px;}
  .rec-note{flex:2;min-width:120px;font-style:italic;}
  .rec-eqname{flex:1;min-width:140px;}
  .rec-opt{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--text-dim);white-space:nowrap;}
  .rec-rm{width:20px;height:20px;flex:none;border-radius:50%;border:1px solid var(--line);background:none;color:var(--text-dim);cursor:pointer;font-size:11px;line-height:1;}
  .rec-rm:hover{border-color:var(--crust);color:var(--crust);}
  .rec-step{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--line);}
  .rec-step:last-of-type{border-bottom:none;}
  .rec-step .num{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--gold-bright);padding-top:9px;min-width:18px;}
  .rec-step textarea{flex:1;background:var(--panel-2);border:1px solid var(--line);color:var(--text);font-family:'Inter';font-size:13px;line-height:1.5;padding:7px 9px;border-radius:5px;resize:vertical;min-height:38px;}
  .rec-add{margin-top:10px;font-family:'Inter';font-weight:600;font-size:12px;background:none;border:1px dashed var(--line);color:var(--text-dim);padding:7px;border-radius:5px;cursor:pointer;width:100%;}
  .rec-add:hover{border-color:var(--gold);color:var(--gold-bright);}
  .rec-editor-foot{display:flex;justify-content:flex-end;margin-top:16px;}
  .rec-delete{font-family:'Inter';font-weight:600;font-size:11.5px;background:none;border:1px solid var(--line);color:var(--text-dim);padding:6px 12px;border-radius:5px;cursor:pointer;}
  .rec-delete:hover{border-color:var(--crust);color:var(--crust);}
  /* scaled card (reuses .ticket paper look) */
  .recipe-card-wrap{position:sticky;top:20px;}
  .recipe-scale-bar{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
  .recipe-scale-bar .lbl{font-family:'Inter';font-weight:600;font-size:12.5px;color:var(--text-dim);margin-right:2px;}
  .scale-btn{font-family:'Inter';font-weight:600;font-size:12.5px;background:var(--panel);border:1px solid var(--line);color:var(--text-dim);padding:6px 13px;border-radius:999px;cursor:pointer;}
  .scale-btn:hover{border-color:var(--gold);}
  .scale-btn.active{background:var(--gold);color:#20180a;border-color:var(--gold);}
  .rc-temp{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--paper-dim);letter-spacing:.03em;margin-bottom:14px;}
  .rc-temp b{color:var(--crust);}
  .rc-section{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--crust);margin:16px 0 6px;font-weight:600;}
  .rc-ing{display:flex;gap:12px;font-size:14px;padding:3px 0;align-items:baseline;}
  .rc-ing .amt{font-weight:600;white-space:nowrap;font-family:'IBM Plex Mono',monospace;min-width:78px;color:var(--paper-ink);}
  .rc-ing .body .nm{color:var(--paper-ink);}
  .rc-ing .body .nt{display:block;font-size:11.5px;font-style:italic;color:var(--paper-dim);}
  .rc-equip{font-size:13px;padding:2px 0;color:var(--paper-ink);}
  .rc-equip .opt{color:var(--paper-dim);font-style:italic;font-size:11.5px;}
  .rc-step{display:flex;gap:9px;font-size:13px;line-height:1.5;padding:5px 0;color:var(--paper-ink);}
  .rc-step .n{font-weight:700;color:var(--crust);min-width:16px;}
  .rc-equip .prep-key{color:var(--crust);font-weight:600;}
  .rc-yield{font-size:14px;color:var(--paper-ink);padding:2px 0;}
  .rec-yield-row{display:flex;align-items:center;gap:8px;margin-top:12px;}
  .rec-yield-row input{flex:1;background:var(--panel-2);border:1px solid var(--line);color:var(--text);font-family:'Inter';font-size:13px;padding:7px 9px;border-radius:5px;}
  .rec-yield-row input:focus{outline:none;border-color:var(--gold);}
  .rc-empty{font-size:12.5px;color:var(--paper-dim);}

  @media print{
    body{background:#fff;}
    .shell > header,
    .col-inputs,
    .ticket-toolbar,
    .autosave-badge{ display:none !important; }
    .grid{ display:block; }
    .shell{ max-width:none; margin:0; padding:0; }
    .ticket-wrap{ position:static; }
    .ticket{
      box-shadow:none;
      border:none;
      border-radius:0;
      padding:0;
      color:#000;
      background:#fff;
    }
    .line-item .name, .line-item .amt, .line-item .line-cost, .total-row, .method, .cost-row, .cost-row .amt, .cost-row .per{ color:#000 !important; }
    .perf{ background-image:none; height:1.5px; background:#000; margin:21px 0; }
    .line-item .dots{ border-bottom-color:#999; transform:translateY(-4.5px); }
    .total-row{ border-top-color:#000; }
    @page{ margin:0.6in; }

    /* text scaled 1.5x for print legibility */
    .ticket-title{ font-size:30px; }
    .ticket-sub{ font-size:16.5px; }
    .line-item{ font-size:21px; padding:5.25px 0; }
    .group-heading{ font-size:15.75px; margin:21px 0 6px; }
    .total-row{ font-size:24px; padding-top:15px; margin-top:6px; }
    .cost-row{ font-size:18px; margin-top:9px; }
    .method{ font-size:17.25px; }
    .method-title{ font-size:15.75px; }

    /* recipe card: black-on-white, sized up like the dough ticket */
    .rc-temp, .rc-section, .rc-yield, .rc-ing .amt, .rc-ing .body .nm, .rc-ing .body .nt, .rc-equip, .rc-equip .opt, .rc-equip .prep-key, .rc-step, .rc-step .n{ color:#000 !important; }
    .recipe-card .ticket-title{ font-size:30px; }
    .rc-section{ font-size:15.75px; margin:21px 0 6px; }
    .rc-ing{ font-size:19px; padding:4px 0; }
    .rc-equip, .rc-yield{ font-size:17px; padding:3px 0; }
    .rc-step{ font-size:16px; padding:5px 0; }
  }
</style>
</head>
<body>
<div class="shell">

  <header>
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none">
        <path d="M12 2C12 2 8 6 8 10.5C8 12.9853 9.79086 15 12 15C14.2091 15 16 12.9853 16 10.5C16 6 12 2 12 2Z" stroke="#C89B3C" stroke-width="1.4" stroke-linejoin="round"/>
        <path d="M12 15V22" stroke="#C89B3C" stroke-width="1.4"/>
        <path d="M12 18C12 18 9 18 8 20" stroke="#C89B3C" stroke-width="1.2" stroke-linecap="round"/>
        <path d="M12 18C12 18 15 18 16 20" stroke="#C89B3C" stroke-width="1.2" stroke-linecap="round"/>
      </svg>
      <div>
        <h1>Dough Lab</h1>
        <div class="tag">baker's percentages &middot; live ticket</div>
      </div>
    </div>
    <div class="header-actions">
      <button class="save-chip" id="save-chip" title="Save status"><span class="dot"></span>…</button>
      <div id="lib-actions" style="display:flex;align-items:center;gap:10px;">
        <div class="new-wrap">
          <button class="btn" id="new-btn">+ New</button>
          <div class="new-menu view-hidden" id="new-menu">
            <button data-new="pizza">Pizza Formula</button>
            <button data-new="bagel">Bagels Formula</button>
            <button data-new="donut">Donuts Formula</button>
            <div class="nm-divider"></div>
            <button data-new="blank">Blank Formula</button>
            <button data-new="recipe">New Recipe</button>
          </div>
        </div>
        <button class="btn-secondary" id="pantry-btn">Pantry</button>
      </div>
      <div id="detail-actions" class="view-hidden" style="display:flex;align-items:center;gap:10px;">
        <button class="btn-secondary" id="back-btn">← Library</button>
        <button class="btn-secondary" id="dup-btn">Duplicate</button>
        <button class="btn-secondary" id="detail-pantry-btn">Pantry</button>
      </div>
    </div>
  </header>

  <div id="library-view" class="lib-view view-hidden">
    <div class="lib-toolbar">
      <div class="lib-search" id="lib-search">
        <span class="mag">⌕</span>
        <input type="text" id="lib-q" placeholder="Search formulas and recipes" autocomplete="off" spellcheck="false" />
        <button class="clear" id="lib-q-clear" title="Clear (Esc)" aria-label="Clear search">✕</button>
      </div>
      <div class="tag-pills view-hidden" id="lib-tags"></div>
    </div>
    <div class="lib-section" id="lib-formulas">
      <p class="section-label">Formulas <span class="lib-count" id="count-formulas"></span></p>
      <div class="lib-cards"></div>
    </div>
    <div class="lib-section" id="lib-recipes">
      <p class="section-label">Recipes <span class="lib-count" id="count-recipes"></span></p>
      <div class="lib-cards"></div>
    </div>

<script>
(function(){

/* ---------- default state per type, matching real recipes ---------- */
function mkExtra(name, pct){ return { id:'e'+Math.random().toString(36).slice(2,9), name, pct }; }
function mkAssemblyItem(name, qty, unit){ return { id:'top'+Math.random().toString(36).slice(2,9), name, qty, unit }; }

const PF_METHODS = {
  poolish: { label:'Poolish', pfPercent:20, pfHydration:100, pfYeast:0.15, pfHours:14, pfTemp:'room temp (68–70°F)' },
  biga:    { label:'Biga',    pfPercent:45, pfHydration:55,  pfYeast:0.12, pfHours:16, pfTemp:'cool spot (60–65°F)' },
  sponge:  { label:'Sponge',  pfPercent:56, pfHydration:null, pfYeast:0.78, pfHours:12, pfTemp:'room temp, overnight' },
  custom:  { label:'Preferment' }
};

function defaultPizza(){
  return {
    type:'pizza',
    hydration:66, salt:2, yeast:1, yeastType:'ady',
    extras:[ mkExtra('EVOO',5), mkExtra('DMP',0.75), mkExtra('Malt syrup',2) ],
    pfEnabled:false, pfMethod:'biga', pfPercent:45, pfHydration:55, pfYeast:0.12, pfHours:16, pfTemp:'cool spot (60–65°F)',
    pieces:4, wpp:300,
    flour:700, flourAuto:true,
    recipeName:'',
    notes:'Mix, bulk ferment, ball, cold retard in fridge 24–72h. Pull ~2h before baking to warm up, shape, and bake hot.',
    assembly:[]
  };
}
function defaultBagel(){
  return {
    type:'bagel',
    hydration:62, salt:2.75, yeast:0.66, yeastType:'ady',
    extras:[ mkExtra('DMP',0.75), mkExtra('Malt syrup',2) ],
    pfEnabled:true, pfMethod:'sponge', pfPercent:56, pfHydration:111, pfYeast:0.78, pfHours:12, pfTemp:'room temp, overnight',
    pieces:12, wpp:120,
    flour:910, flourAuto:true,
    recipeName:'',
    notes:'Boil: water + malt syrup, ~45–60s per side.\nBake: 500°F — top rack 6 min, then bottom rack 6 min.'
  };
}
function defaultDonut(){
  // Yeast-raised (enriched) donut dough — the numbers are placeholders pending a real dial-in,
  // like the pizza/bagel defaults were. Fits the yeast + baker's-% engine; cake donuts (baking-powder
  // leavened) would not, so this is deliberately the raised style.
  return {
    type:'donut',
    hydration:52, salt:1.5, yeast:1.5, yeastType:'ady',
    extras:[ mkExtra('Sugar',12), mkExtra('Butter',10), mkExtra('Egg',10) ],
    pfEnabled:false, pfMethod:'poolish', pfPercent:20, pfHydration:100, pfYeast:0.15, pfHours:12, pfTemp:'room temp, overnight',
    pieces:12, wpp:60,
    flour:400, flourAuto:true,
    recipeName:'',
    notes:'Mix enriched dough, bulk ferment ~1h. Roll ~1cm, cut. Proof until puffy (~45–60 min). Fry 350–375°F, ~60–90s per side. Glaze while warm.'
  };
}

/* ---------- ids (declared early: used by the library seed below) ---------- */
function rid(p){ return p + Math.random().toString(36).slice(2,9); }

/* ---------- library: the single store of items — formula (dough) + recipe (general) ----------
   Phase 1 of the roll-up. `library` is the source of truth. `state.pizza/bagel/donut` are live
   POINTERS into the three seed formula items, so the existing dough engine (which reads
   state[activeType]) keeps working unchanged. Recipe items live in the same library. */
const DEFAULT_FORMULA = { pizza: defaultPizza, bagel: defaultBagel, donut: defaultDonut };
function mkFormula(type){ return Object.assign(DEFAULT_FORMULA[type](), { id:rid('f'), kind:'formula', tags:[] }); }
function seedLibrary(data){
  const lib = ['pizza','bagel','donut'].map(mkFormula);
  // fold any existing recipes (shape-compatible) into the library, tagged as recipe items
  (data && Array.isArray(data.recipes) ? data.recipes : []).forEach(r => lib.push(Object.assign({}, r, { kind:'recipe' })));
  return lib;
}
function recipeItems(){ return library.filter(x => x.kind === 'recipe'); }
function linkFormulaPointers(){
  ['pizza','bagel','donut'].forEach(t => {
    let f = library.find(x => x.kind === 'formula' && x.type === t);
    if(!f){ f = mkFormula(t); library.push(f); }
    state[t] = f;
  });
}

let library = ['pizza','bagel','donut'].map(mkFormula);
let state = { pizza: library[0], bagel: library[1], donut: library[2] };
let activeType = 'pizza';
let screen = 'library'; // 'library' | 'formula' | 'recipe' | 'pantry'
let showLineCosts = false;
let presets = [];
let scrapOn = false;
let scrapPct = 3;
let pantry = [];
let activeRecipeId = null;
let fileHandle = null;
let fileName = '';
// persistence state, surfaced by the header save-chip and Data File panel
let dirty = false;       // in-memory changes not yet confirmed written
let saving = false;      // a write is in flight
let lastError = false;   // the last write attempt failed
let lastSavedAt = null;  // ms timestamp of the last successful persist (or the loaded file's savedAt)

/* ---------- recipe box (general scalable recipes; items live in `library` with kind:'recipe') ---------- */
function mkRecipe(name){ return { id:rid('rec'), name:name||'', yield:'', ovenTempF:'', scale:1, ingredients:[], equipment:[], steps:[], kind:'recipe', tags:[] }; }
function mkRecipeIng(){ return { id:rid('ri'), amount:'', unit:'', name:'', note:'' }; }
function mkEquip(){ return { id:rid('eq'), name:'', optional:false }; }
function mkStep(){ return { id:rid('st'), text:'' }; }
const RECIPE_UNITS = ['','cup','cups','tbsp','tsp','oz','lb','g','kg','mL','L','pinch','clove','can'];

const YEAST_FACTORS = { idy:1, ady:1.25, fresh:3 };
const YEAST_LABELS = { idy:'Instant dry', ady:'Active dry', fresh:'Fresh / cake' };
const UNIT_GRAMS = { g:1, kg:1000, oz:28.349523125, lb:453.59237 };

function mkPantryItem(name, packageQty, packageUnit, packageCost){
  return { id:'ing'+Math.random().toString(36).slice(2,9), name, packageQty, packageUnit, packageCost };
}
function mkCompoundItem(name){
  return { id:'ing'+Math.random().toString(36).slice(2,9), name, kind:'compound', components:[] };
}
function mkComponent(name, quantity, qty, unit, cost){
  return { id:'pc'+Math.random().toString(36).slice(2,9), name, quantity, qty, unit, cost };
}
/* count multiplier: absent (old data) = 1; an explicit numeric value (incl. 0) is honored. */
function compQuantity(c){ return c.quantity == null ? 1 : (+c.quantity || 0); }

/* ---------- storage: a JSON file on disk (via File System Access API), next to this HTML file ----------
   Falls back gracefully (nothing persists) in browsers without the API — Chrome/Edge only. */
let saveTimer = null;

function setSaveBadge(text, cls){
  const b = document.getElementById('autosave-badge');
  if(!b) return;
  b.textContent = text;
  b.className = 'autosave-badge show' + (cls ? (' '+cls) : '');
}
function hideSaveBadgeSoon(delay){
  clearTimeout(hideSaveBadgeSoon._t);
  hideSaveBadgeSoon._t = setTimeout(()=>{
    const b = document.getElementById('autosave-badge');
    if(b) b.classList.remove('show');
  }, delay || 1400);
}

/* ---------- always-on persistence status (header chip + Data File panel) ---------- */
/* Where the current in-memory state can be written, right now:
   'device'       — no File System Access API (iPad/Firefox): auto-saved to this browser's storage
   'connected'    — desktop with an active data-file handle: auto-saved to that JSON file
   'disconnected' — desktop with no usable handle (never connected, or permission lapsed):
                    edits live ONLY in this tab's memory and are lost on reload */
function connState(){
  if(!HAS_FSA) return 'device';
  return fileHandle ? 'connected' : 'disconnected';
}
function hasUserData(){ return (library && library.length) || (pantry && pantry.length); }
function relTime(ts){
  if(!ts) return '';
  const s = Math.max(0, Math.round((Date.now() - ts) / 1000));
  if(s < 10) return 'just now';
  if(s < 60) return s + 's ago';
  const m = Math.round(s / 60); if(m < 60) return m + 'm ago';
  const h = Math.round(m / 60); if(h < 24) return h + 'h ago';
  return Math.round(h / 24) + 'd ago';
}
function renderSaveChip(){
  const chip = document.getElementById('save-chip');
  if(!chip) return;
  const cs = connState();
  let cls, label, title;
  if(cs === 'disconnected'){
    if(hasUserData()){
      cls = 'danger'; label = 'Not saved';
      title = "These changes are only in this tab's memory and will be lost if you reload. Click to connect a data file.";
    }else{
      cls = 'warn'; label = 'No data file';
      title = 'Nothing is being saved yet. Click to connect a data file.';
    }
  }else if(saving){
    cls = 'saving'; label = 'Saving…'; title = 'Writing your data…';
  }else if(lastError){
    cls = 'danger'; label = 'Save failed';
    title = "The last save didn't go through. Click to check the data file.";
  }else if(dirty){
    cls = 'saving'; label = 'Saving…'; title = 'Unsaved changes — saving shortly.';
  }else{
    cls = 'ok'; label = 'Saved';
    const where = cs === 'device' ? 'this device' : (fileName || 'the data file');
    title = 'Saved to ' + where + (lastSavedAt ? ' · ' + relTime(lastSavedAt) : '');
  }
  chip.className = 'save-chip ' + cls;
  chip.innerHTML = '<span class="dot"></span>' + escapeHtml(label);
  chip.title = title;
}
/* Fills the Data File panel's detail line (filename / last-saved / an honest note about the folder). */
function refreshDatafileDetail(){
  const el = document.getElementById('datafile-detail');
  if(!el) return;
  const cs = connState();
  const saved = lastSavedAt ? `Last saved: <b>${relTime(lastSavedAt)}</b>` : '';
  if(cs === 'connected'){
    el.innerHTML =
      `File: <b>${escapeHtml(fileName || 'dough-lab-data.json')}</b><br>` +
      `<span class="df-note">Changes save to this file automatically. Browsers can't reveal a file's folder for security — it's wherever you picked it (e.g. your Dough Lab folder or iCloud Drive).</span>` +
      (saved ? `<br>${saved}` : '');
  }else if(cs === 'device'){
    el.innerHTML =
      `Stored in <b>this browser on this device</b> (not a file you can open in Files).` +
      (saved ? `<br>${saved}` : '') +
      `<br><span class="df-note">Use Export to save a JSON copy you can back up or move to another device.</span>`;
  }else{
    el.innerHTML = ''; // disconnected: the status line above already explains it
  }
}

/* small IndexedDB key/value store, just to remember the file handle across reloads */
const IDB_NAME = 'doughlab-fs', IDB_STORE = 'handles';
function idbOpen(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(IDB_STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbSet(key, val){
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put(val, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function idbGet(key){
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, 'readonly');
    const rq = tx.objectStore(IDB_STORE).get(key);
    rq.onsuccess = () => resolve(rq.result);
    rq.onerror = () => reject(rq.error);
  });
}
async function idbGetHandle(){ try{ return await idbGet('fileHandle'); }catch(e){ return null; } }
async function idbSetHandle(h){ try{ await idbSet('fileHandle', h); }catch(e){ console.error('failed to remember file handle', e); } }

function defaultDataShape(){
  return {
    pantry: [ mkPantryItem('Flour',0,'lb',0), mkPantryItem('Water',0,'lb',0), mkPantryItem('Salt',0,'lb',0), mkPantryItem('Yeast',0,'lb',0) ],
    presets: [],
    currentState: null
  };
}
/* one-time migration path: if a brand-new/empty data file is connected, pull in whatever
   was previously saved under the old localStorage keys so nothing gets lost. */
function seedFromLocalStorage(data){
  try{
    const list = localStorage.getItem('presets-v2');
    if(list){ const parsed = JSON.parse(list); if(Array.isArray(parsed)) data.presets = parsed; }
  }catch(e){}
  try{
    const cur = localStorage.getItem('current-state-v2');
    if(cur) data.currentState = JSON.parse(cur);
  }catch(e){}
  return data;
}

async function writeToHandle(handle, data){
  const writable = await handle.createWritable();
  await writable.write(JSON.stringify(data, null, 2));
  await writable.close();
}
async function readAndApply(handle){
  const file = await handle.getFile();
  const text = await file.text();
  let data;
  if(!text || !text.trim()){
    data = seedFromLocalStorage(defaultDataShape());
    await writeToHandle(handle, data);
  }else{
    try{ data = JSON.parse(text); }
    catch(e){ data = seedFromLocalStorage(defaultDataShape()); }
  }
  applyData(data);
}
function applyData(data){
  // Greenfield: the library is the store. An old file (no `library`) seeds fresh formulas and
  // folds its recipes in; its `pantry` is kept as-is; its old dough `currentState` is ignored.
  library = Array.isArray(data.library) ? data.library : seedLibrary(data);
  pantry = Array.isArray(data.pantry) ? data.pantry : [];
  presets = Array.isArray(data.presets) ? data.presets : [];
  linkFormulaPointers();
  const cur = data.ui || data.currentState;
  if(cur){
    if(cur.activeType) activeType = cur.activeType;
    if(typeof cur.scrapOn === 'boolean') scrapOn = cur.scrapOn;
    if(typeof cur.scrapPct === 'number') scrapPct = cur.scrapPct;
    if(typeof cur.showLineCosts === 'boolean') showLineCosts = cur.showLineCosts;
    if(cur.activeRecipeId) activeRecipeId = cur.activeRecipeId;
  }
  const recs = recipeItems();
  if(!recs.find(r => r.id === activeRecipeId)) activeRecipeId = recs[0] ? recs[0].id : null;
  // freshly loaded state matches its source, so it counts as saved
  dirty = false; lastError = false;
  if(data && data.savedAt){ const t = Date.parse(data.savedAt); if(!isNaN(t)) lastSavedAt = t; }
  screen = 'library';
  render();
  renderSaveChip();
  refreshDatafileDetail();
}

/* One place that describes the full saved payload — used by file writes, localStorage, and Export.
   `formatVersion` (data-schema version) + `savedAt` (recency) are stamped in so a file's currency is
   knowable even if it gets renamed; applyData ignores them if absent. */
const FORMAT_VERSION = 2; // 2 = library model (formula + recipe items); 1 = legacy pizza/bagel/donut + recipes
function currentData(){
  // `library` already contains the formula items that state.pizza/bagel/donut point into, plus recipe items.
  return { formatVersion: FORMAT_VERSION, savedAt: new Date().toISOString(), library, pantry, presets, ui: {activeType, activeRecipeId, scrapOn, scrapPct, showLineCosts} };
}
/* Plain, recognizable export name. Recency still lives in the payload's `savedAt` field (and the OS
   file date); the earlier timestamped filename was dropped as more confusing than helpful in practice. */
function exportFilename(){
  return 'dough-lab-data.json';
}

/* Persistence routes on capability: desktop Chrome/Edge write the user's data file (File System
   Access API); everywhere else (iPad Safari, Firefox…) auto-save to this browser's localStorage. */
const HAS_FSA = !!window.showOpenFilePicker;
const LOCAL_KEY = 'doughlab-data-v1';

async function saveNow(){
  if(HAS_FSA){
    if(!fileHandle){ renderSaveChip(); return false; }
    saving = true; renderSaveChip();
    try{
      await writeToHandle(fileHandle, currentData());
      dirty = false; saving = false; lastError = false; lastSavedAt = Date.now();
      renderSaveChip(); refreshDatafileDetail();
      return true;
    }catch(e){
      saving = false; lastError = true;
      console.error('data file write failed', e);
      renderSaveChip();
      return false;
    }
  }
  saving = true; renderSaveChip();
  try{
    localStorage.setItem(LOCAL_KEY, JSON.stringify(currentData()));
    dirty = false; saving = false; lastError = false; lastSavedAt = Date.now();
    renderSaveChip(); refreshDatafileDetail();
    return true;
  }catch(e){
    saving = false; lastError = true;
    console.error('localStorage write failed', e);
    renderSaveChip();
    return false;
  }
}
function scheduleSave(){
  dirty = true;
  renderSaveChip();
  if(HAS_FSA && !fileHandle) return; // desktop, no file: nothing to write — the chip now shows the risk
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, 300);
}
function initLocalStorage(){
  try{
    const raw = localStorage.getItem(LOCAL_KEY);
    if(raw) applyData(JSON.parse(raw));
  }catch(e){ console.warn('no on-device data yet, or localStorage unavailable', e); }
  renderAll();

/* ---------- portable Export / Import (works on every platform; also the cross-device sync path) ---------- */
function exportData(){
  const blob = new Blob([JSON.stringify(currentData(), null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = exportFilename();
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
  setSaveBadge('Exported', 'ok'); hideSaveBadgeSoon();
}
function importData(){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'application/json,.json';
  inp.onchange = () => {
    const file = inp.files && inp.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      let data;
      try{ data = JSON.parse(reader.result); }
      catch(e){ setSaveBadge('Import failed — not valid JSON', 'error'); return; }
      if(!confirm('Replace the current pantry and saved recipes with the imported file?')) return;
      applyData(data);
      renderAll();
      saveNow();
      setSaveBadge('Imported', 'ok'); hideSaveBadgeSoon();
    };
    reader.readAsText(file);
  };
  inp.click();
}

async function connectNew(){
  try{
    const handle = await window.showSaveFilePicker({
      suggestedName:'dough-lab-data.json',
      types:[{ description:'Dough Lab data', accept:{'application/json':['.json']} }]
    });
    await idbSetHandle(handle);
    fileHandle = handle; fileName = handle.name;
    await readAndApply(handle);
    renderAll();
    updateDatafileUI('connected');
  }catch(e){ if(e.name !== 'AbortError') console.error(e); }
}
async function connectExisting(){
  try{
    const [handle] = await window.showOpenFilePicker({
      types:[{ description:'Dough Lab data', accept:{'application/json':['.json']} }]
    });
    await idbSetHandle(handle);
    fileHandle = handle; fileName = handle.name;
    await readAndApply(handle);
    renderAll();
    updateDatafileUI('connected');
  }catch(e){ if(e.name !== 'AbortError') console.error(e); }
}
async function reconnectPermission(handle){
  try{
    const perm = await handle.requestPermission({mode:'readwrite'});
    if(perm === 'granted'){
      fileHandle = handle; fileName = handle.name;
      await readAndApply(handle);
      renderAll();
      updateDatafileUI('connected');
    }else{
      updateDatafileUI('reconnect', handle);
    }
  }catch(e){ console.error(e); updateDatafileUI('reconnect', handle); }
}
async function tryReconnect(){
  if(!window.showOpenFilePicker){ updateDatafileUI('unsupported'); return; }
  const handle = await idbGetHandle();
  if(!handle){ updateDatafileUI('none'); return; }
  fileName = handle.name;
  const perm = await handle.queryPermission({mode:'readwrite'});
  if(perm === 'granted'){
    fileHandle = handle;
    await readAndApply(handle);
    renderAll();
    updateDatafileUI('connected');
  }else{
    updateDatafileUI('reconnect', handle);
  }
}
function updateDatafileUI(mode, pendingHandle){
  const statusEl = document.getElementById('datafile-status');
  const actionsEl = document.getElementById('datafile-actions');
  statusEl.className = 'datafile-status';
  if(mode === 'unsupported'){
    statusEl.classList.add('warn');
    statusEl.innerHTML = "This browser can't save to a file directly (Chrome or Edge needed). Work stays in this tab only — use <b>Export</b> to keep a copy.";
    actionsEl.innerHTML = '';
  }else if(mode === 'local'){
    statusEl.innerHTML = "Auto-saving to this device.";
    actionsEl.innerHTML = '';
  }else if(mode === 'connected'){
    statusEl.innerHTML = "Connected — changes save automatically.";
    actionsEl.innerHTML = `<button class="btn-secondary" id="df-switch">Use a Different File</button>`;
    document.getElementById('df-switch').onclick = connectExisting;
  }else if(mode === 'reconnect'){
    statusEl.classList.add('danger');
    statusEl.innerHTML = `Reconnect needed for <b>${escapeHtml(fileName)}</b> — until you do, changes stay in this tab's memory only and are lost on reload.`;
    actionsEl.innerHTML = `<button class="btn-secondary" id="df-reconnect">Reconnect</button><button class="btn-secondary" id="df-switch">Use a Different File</button>`;
    document.getElementById('df-reconnect').onclick = () => reconnectPermission(pendingHandle);
    document.getElementById('df-switch').onclick = connectExisting;
  }else{
    statusEl.classList.add('danger');
    statusEl.innerHTML = "Not connected — anything you enter now is kept only in this tab and is lost on reload. Connect a file to start saving.";
    actionsEl.innerHTML = `<button class="btn-secondary" id="df-create">Create Data File</button><button class="btn-secondary" id="df-open">Open Existing File</button>`;
    document.getElementById('df-create').onclick = connectNew;
    document.getElementById('df-open').onclick = connectExisting;
  }
  renderSaveChip();
  refreshDatafileDetail();
}


/* ---------- number helpers ---------- */
function round(n, step){ return Math.round(n/step)*step; }
function fmt(n){
  const v = Math.round(n*10)/10;
  return (v % 1 === 0) ? String(Math.round(v)) : v.toFixed(1);
}

/* ---------- calculation ---------- */
function totalPctOf(s){
  const yeastPct = s.yeast * (YEAST_FACTORS[s.yeastType] || 1);
  const extrasPct = s.extras.reduce((sum,e)=> sum + (+e.pct || 0), 0);
  return 100 + s.hydration + s.salt + yeastPct + extrasPct;
}
function autoFlourFor(s){
  const target = s.pieces * s.wpp * (scrapOn ? (1 + scrapPct/100) : 1);
  return target / (totalPctOf(s)/100);
}
function syncFlour(s){
  if(s.flourAuto){
    s.flour = round(autoFlourFor(s), 5);
  }
}

function calc(s){
  const yeastMult = YEAST_FACTORS[s.yeastType] || 1;
  const yeastPct = s.yeast * yeastMult;
  const flour = s.flour;
  const water = flour * s.hydration/100;
  const salt = flour * s.salt/100;
  const yeastW = flour * yeastPct/100;
  const extras = s.extras.map(e => ({ name: e.name || 'Ingredient', grams: flour * (+e.pct||0)/100 }));

  let pf = null, final = { flour, water, salt, yeast:yeastW };
  if(s.pfEnabled){
    const pfFlour = flour * s.pfPercent/100;
    // Sponge commits ALL the formula's water, by definition — hydration is derived, not set.
    const pfHydrationEffective = (s.pfMethod === 'sponge')
      ? (pfFlour > 0 ? (water / pfFlour * 100) : 0)
      : s.pfHydration;
    const pfWater = pfFlour * pfHydrationEffective/100;
    const pfYeast = pfFlour * s.pfYeast/100;
    pf = { flour:pfFlour, water:pfWater, yeast:pfYeast, hydrationEffective:pfHydrationEffective };
    final = {
      flour: flour - pfFlour,
      water: water - pfWater,
      salt: salt,
      yeast: Math.max(0, yeastW - pfYeast)
    };
  }
  const extrasTotal = extras.reduce((sum,e)=>sum+e.grams,0);
  const totalWeight = flour + water + salt + yeastW + extrasTotal;
  const targetWeight = s.pieces * s.wpp * (scrapOn ? (1 + scrapPct/100) : 1);
  return { flour, water, salt, yeastW, extras, totalWeight, targetWeight, pf, final, yeastPct };
}

/* ---------- pantry cost calc: matches ticket line-item names against pantry entries ---------- */
function compoundGrams(item){
  return (item.components||[]).reduce((s,c)=> s + compQuantity(c)*(+c.qty||0)*(UNIT_GRAMS[c.unit]||1), 0);
}
function compoundCost(item){
  return (item.components||[]).reduce((s,c)=> s + compQuantity(c)*(+c.cost||0), 0);
}
/* A pantry item's cost-per-gram — derived from its components if compound, else from its package. */
function itemRatePerGram(item){
  if(!item) return null;
  if(item.kind === 'compound'){
    const grams = compoundGrams(item), cost = compoundCost(item);
    if(grams <= 0 || cost <= 0) return null;
    return cost / grams;
  }
  const grams = (+item.packageQty||0) * (UNIT_GRAMS[item.packageUnit]||1);
  if(grams <= 0 || !item.packageCost) return null;
  return (+item.packageCost) / grams;
}
function pantryRatePerGram(name){
  if(!name) return null;
  const key = name.trim().toLowerCase();
  const item = pantry.find(p => (p.name||'').trim().toLowerCase() === key);
  return itemRatePerGram(item);
}
function calcCost(r){
  let total = 0, matchedAny = false;
  const items = [ ['Flour', r.flour], ['Water', r.water], ['Salt', r.salt], ['Yeast', r.yeastW] ];
  r.extras.forEach(e => items.push([e.name, e.grams]));
  items.forEach(([name, grams]) => {
    const rate = pantryRatePerGram(name);
    if(rate != null){ total += rate * grams; matchedAny = true; }
  });
  return matchedAny ? total : null;
}
function fmtMoney(n){ return '$' + n.toFixed(2); }
function pantryRateLabel(p){
  const rate = itemRatePerGram(p);
  if(rate == null) return '';
  return '≈ $' + (rate*1000).toFixed(3) + '/kg';
}

/* ---------- finished pie cost: dough ball (from the live ticket) + assembly toppings ---------- */
function costPerPiece(s){
  const total = calcCost(calc(s));
  return total != null ? total / s.pieces : null;
}
function assemblyItemGrams(item){ return (+item.qty||0) * (UNIT_GRAMS[item.unit]||1); }
function assemblyItemCost(item){
  const rate = pantryRatePerGram(item.name);
  return rate != null ? rate * assemblyItemGrams(item) : null;
}
function calcAssemblyTotal(assembly){
  return assembly.reduce((sum, item) => {
    const c = assemblyItemCost(item);
    return c != null ? sum + c : sum;
  }, 0);
}

/* ---------- render: ticket ---------- */
function renderTicket(){
  const s = state[activeType];
  const r = calc(s);
  const driftsFromTarget = Math.abs(r.totalWeight - r.targetWeight) > 0.5;

  let html = '';
  const titleText = (s.name && s.name.trim())
    ? s.name.trim()
    : (s.recipeName && s.recipeName.trim())
      ? s.recipeName.trim()
      : (({bagel:'Bagel Dough', donut:'Donut Dough'})[activeType] || 'Pizza Dough');
  html += `<div class="ticket-title">${escapeHtml(titleText)}</div>`;
  html += `<div class="ticket-sub">${s.pieces} × ${fmt(s.wpp)}g target`;
  if(scrapOn) html += ` <b>+${fmt(scrapPct)}% scrap</b>`;
  if(driftsFromTarget) html += ` &nbsp;·&nbsp; <b>${fmt(round(r.totalWeight,1))}g actual</b>`;
  html += ` &nbsp;·&nbsp; ${fmt(s.hydration)}% hydration</div>`;
  html += `<div class="perf"></div>`;

  if(r.pf){
    const pfLabel = (PF_METHODS[s.pfMethod] && PF_METHODS[s.pfMethod].label) || 'Preferment';
    html += `<div class="group-heading">${pfLabel} — ${fmt(r.pf.hydrationEffective)}% hydration, build ${fmt(s.pfHours)}h ahead, ${s.pfTemp}</div>`;
    html += line('Flour', r.pf.flour, true);
    html += line('Water', r.pf.water, true);
    html += line('Yeast', r.pf.yeast, true);

    html += `<div class="group-heading">Final Mix — add to ripe ${pfLabel.toLowerCase()}</div>`;
    html += line('Flour', r.final.flour);
    html += line('Water', r.final.water);
    html += line('Salt', r.final.salt);
    if(r.final.yeast > 0.05) html += line('Yeast', r.final.yeast);
    r.extras.forEach(e => { if(e.grams > 0) html += line(e.name, e.grams); });
  }else{
    html += `<div class="group-heading">Mix</div>`;
    html += line('Flour', r.flour);
    html += line('Water', r.water);
    html += line('Salt', r.salt);
    html += line('Yeast', r.yeastW);
    r.extras.forEach(e => { if(e.grams > 0) html += line(e.name, e.grams); });
  }

  html += `<div class="total-row"><span>Total Dough</span><span>${fmt(round(r.totalWeight,1))} g</span></div>`;

  const cost = calcCost(r);
  if(cost != null){
    html += `<div class="cost-row"><span>Est. Cost</span><span class="amt">${fmtMoney(cost)}<span class="per"> (${fmtMoney(cost / s.pieces)}/ea)</span></span></div>`;
  }

  html += `<div class="method-block yeast-note">`;
  html += `<div class="method-title">Yeast Note</div>`;
  html += `<div class="method">Percentages are entered as ${YEAST_LABELS[s.yeastType]}${s.yeastType!=='idy' ? ` (×${YEAST_FACTORS[s.yeastType]} vs. instant dry)` : ''}. Effective yeast: <b>${fmt(s.yeast * YEAST_FACTORS[s.yeastType])}%</b> of total flour.</div>`;
  html += `</div>`;

  if(s.notes && s.notes.trim()){
    html += `<div class="method-block">`;
    html += `<div class="method-title">Method</div>`;
    html += `<div class="method">${escapeHtml(s.notes)}</div>`;
    html += `</div>`;
  }

  document.getElementById('ticket').innerHTML = html;

  function line(name, grams, sub){
    const precision = 1;
    let costHtml = '';
    if(showLineCosts){
      const rate = pantryRatePerGram(name);
      if(rate != null) costHtml = ` <span class="line-cost">(${fmtMoney(rate*grams)})</span>`;
    }
    return `<div class="line-item${sub?' sub':''}"><span class="name">${escapeHtml(name)}</span><span class="dots"></span><span class="amt">${fmt(round(grams,precision))} g${costHtml}</span></div>`;
  }
}
function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

/* ---------- ingredient-name autocomplete, sourced from Pantry item names ---------- */
function pantryNameSuggestions(query){
  const seen = new Set(), out = [];
  const q = (query||'').trim().toLowerCase();
  pantry.forEach(p => {
    const name = (p.name||'').trim();
    if(!name) return;
    const key = name.toLowerCase();
    if(seen.has(key)) return;
    if(q && !key.includes(q)) return;
    seen.add(key);
    out.push({ name, rate: itemRatePerGram(p) });
  });
  return out;
}
let acEl = null, acInput = null, acCommit = null, acActive = -1, acMatches = [];
function ensureAcEl(){
  if(acEl) return acEl;
  acEl = document.createElement('div');
  acEl.className = 'ac-menu hidden';
  acEl.addEventListener('mousedown', e => e.preventDefault()); // don't blur the input on menu click
  document.body.appendChild(acEl);
  return acEl;
}
function positionAc(){
  const r = acInput.getBoundingClientRect();
  acEl.style.left = (r.left + window.scrollX) + 'px';
  acEl.style.top = (r.bottom + window.scrollY + 4) + 'px';
  acEl.style.width = r.width + 'px';
}
function renderAc(){
  if(!acInput) return;
  acMatches = pantryNameSuggestions(acInput.value);
  if(acMatches.length === 0){ closeAc(); return; }
  ensureAcEl();
  acEl.innerHTML = acMatches.map((m,i) =>
    `<div class="ac-item${i===acActive?' active':''}" data-i="${i}"><span>${escapeHtml(m.name)}</span>${m.rate!=null?`<span class="ac-rate">$${(m.rate*1000).toFixed(2)}/kg</span>`:''}</div>`
  ).join('');
  acEl.querySelectorAll('.ac-item').forEach(it => {
    it.onmousedown = e => { e.preventDefault(); selectAc(+it.getAttribute('data-i')); };
  });
  acEl.classList.remove('hidden');
  positionAc();
}
function openAc(input, commit){ acInput = input; acCommit = commit; acActive = -1; renderAc(); }
function selectAc(i){
  const m = acMatches[i]; if(!m) return;
  const input = acInput, commit = acCommit;
  input.value = m.name;
  closeAc();
  if(commit) commit(m.name);
}
function closeAc(){ if(acEl) acEl.classList.add('hidden'); acInput = null; acCommit = null; acActive = -1; acMatches = []; }
function acKeydown(e){
  if(!acEl || acEl.classList.contains('hidden')) return;
  if(e.key === 'ArrowDown'){ e.preventDefault(); acActive = Math.min(acActive+1, acMatches.length-1); syncAcActive(); }
  else if(e.key === 'ArrowUp'){ e.preventDefault(); acActive = Math.max(acActive-1, 0); syncAcActive(); }
  else if(e.key === 'Enter' && acActive >= 0){ e.preventDefault(); selectAc(acActive); }
  else if(e.key === 'Escape'){ closeAc(); }
}
function syncAcActive(){
  acEl.querySelectorAll('.ac-item').forEach((it,i)=> it.classList.toggle('active', i===acActive));
  const a = acEl.querySelector('.ac-item.active');
  if(a) a.scrollIntoView({block:'nearest'});
}
function attachPantryAutocomplete(input, commit){
  const open = () => openAc(input, commit);
  input.addEventListener('focus', open);
  input.addEventListener('input', open); // reopen on every keystroke, even if a prior render found 0 matches and closed
  input.addEventListener('keydown', acKeydown);
  input.addEventListener('blur', () => setTimeout(()=>{ if(acInput === input) closeAc(); }, 120));
}

/* ---------- recipe box: amount parsing / fraction display ---------- */
function parseAmount(str){
  if(str == null) return null;
  const s = String(str).trim();
  if(s === '') return null;
  let m = s.match(/^(\d+)\s+(\d+)\/(\d+)$/); // "1 1/2"
  if(m) return (+m[1]) + (+m[2])/(+m[3]);
  m = s.match(/^(\d+)\/(\d+)$/);             // "3/4"
  if(m) return (+m[1])/(+m[2]);
  const n = parseFloat(s);
  return isNaN(n) ? null : n;
}
/* Full-size ASCII fractions ("1 1/2", "3/4") — chosen over tiny Unicode glyphs (½, ⅜…) for
   legibility on the card, bench view, and printed card. parseAmount already reads this format. */
const ASCII_FRAC = {0.125:'1/8',0.25:'1/4',0.333:'1/3',0.375:'3/8',0.5:'1/2',0.625:'5/8',0.667:'2/3',0.75:'3/4',0.875:'7/8'};
function formatAmount(n){
  if(n == null) return '';
  if(Math.abs(n) < 1e-9) return '0';
  const whole = Math.floor(n + 1e-9);
  const frac = n - whole;
  const candidates = [0,0.125,0.25,0.333,0.375,0.5,0.625,0.667,0.75,0.875,1];
  let best = 0, bd = Infinity;
  candidates.forEach(c => { const d = Math.abs(frac - c); if(d < bd){ bd = d; best = c; } });
  let w = whole, f = best;
  if(f === 1){ w += 1; f = 0; }
  const fracStr = f === 0 ? '' : (ASCII_FRAC[f] || '');
  if(w === 0 && fracStr) return fracStr;          // "3/4"
  if(fracStr) return w + ' ' + fracStr;           // "1 1/2"
  return String(w);
}
function displayAmount(ing, scale){
  const p = parseAmount(ing.amount);
  if(p == null) return (ing.amount||'').trim(); // non-numeric like "a pinch" — show as-is
  return formatAmount(p * scale);
}
/* Scale a yield string by its leading number, keeping the rest ("24 cookies" ×2 → "48 cookies"). */
function scaleYield(str, scale){
  if(scale === 1 || !str) return str;
  const m = str.match(/^\s*(\d+\s+\d+\/\d+|\d+\/\d+|\d*\.\d+|\d+)\s*(.*)$/);
  if(!m) return str;
  const n = parseAmount(m[1]);
  if(n == null) return str;
  return formatAmount(n * scale) + (m[2] ? ' ' + m[2] : '');
}
