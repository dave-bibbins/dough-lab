    html += `<div class="rc-section">Equipment &amp; Prep</div>`;
    if(hasTemp) html += `<div class="rc-equip"><span class="prep-key">Oven</span> ${escapeHtml(String(r.ovenTempF))}°F</div>`;
    eqs.forEach(e => { html += `<div class="rc-equip">${escapeHtml(e.name)}${e.optional?` <span class="opt">(optional)</span>`:''}</div>`; });
  }
  // Ingredients
  const ings = r.ingredients.filter(i => (i.name||'').trim() || (i.amount||'').trim());
  if(ings.length){
    html += `<div class="rc-section">Ingredients</div>`;
    ings.forEach(i => {
      const amt = displayAmount(i, scale), unit = i.unit ? ' ' + i.unit : '';
      html += `<div class="rc-ing"><span class="amt">${escapeHtml(amt + unit)}</span><span class="body"><span class="nm">${escapeHtml(i.name||'')}</span>${i.note?`<span class="nt">${escapeHtml(i.note)}</span>`:''}</span></div>`;
    });
  }
  // Method
  const steps = r.steps.filter(s => (s.text||'').trim());
  if(steps.length){
    html += `<div class="rc-section">Method</div>`;
    steps.forEach((s,i) => { html += `<div class="rc-step"><span class="n">${i+1}</span><span>${escapeHtml(s.text)}</span></div>`; });
  }
  if(!yieldStr && !hasTemp && !eqs.length && !ings.length && !steps.length) html += `<div class="rc-empty">Add prep, ingredients, and steps in the editor ←</div>`;
  card.innerHTML = html;
  scaleBar.querySelectorAll('.scale-btn').forEach(b => b.onclick = () => { r.scale = +b.getAttribute('data-s'); renderRecipeCard(); scheduleSave(); });
}
function newRecipe(){
  const r = mkRecipe('New Recipe');
  r.ingredients.push(mkRecipeIng());
  r.steps.push(mkStep());
  library.push(r);
  openRecipe(r);
  const n = document.getElementById('rec-name'); if(n){ n.focus(); n.select(); }
}
function deleteRecipe(id){
  const r = library.find(x=>x.id===id && x.kind==='recipe');
  if(r && !confirm(`Delete recipe "${r.name||'Untitled'}"?`)) return;
  library = library.filter(x=>x.id!==id);
  if(activeRecipeId === id){ const recs = recipeItems(); activeRecipeId = recs[0] ? recs[0].id : null; }
  if(screen === 'recipe') screen = 'library';
  render();
  scheduleSave();
}

/* ---------- library home + navigation (Phase 2 shell) ---------- */
function formulaItems(){ return library.filter(x => x.kind === 'formula'); }
function formulaTitle(s){
  return (s.name||'').trim() || (s.recipeName||'').trim() ||
    ({pizza:'Pizza', bagel:'Bagels', donut:'Donuts'}[s.type] || 'Formula');
}
function openFormula(item){ activeType = item.type; state[item.type] = item; screen = 'formula'; render(); scheduleSave(); }
function openRecipe(item){ activeRecipeId = item.id; screen = 'recipe'; render(); scheduleSave(); }
function openPantry(){ screen = 'pantry'; render(); scheduleSave(); }
function goLibrary(){ screen = 'library'; render(); scheduleSave(); }
function duplicateActive(){
  if(screen === 'formula'){
    const orig = state[activeType];
    const copy = JSON.parse(JSON.stringify(orig));
    copy.id = rid('f');
    copy.name = formulaTitle(orig) + ' copy';
    library.push(copy);
    openFormula(copy);
    const n = document.getElementById('formula-name'); if(n){ n.focus(); n.select(); }
  } else if(screen === 'recipe'){
    const orig = activeRecipe();
    if(!orig) return;
    const copy = JSON.parse(JSON.stringify(orig));
    copy.id = rid('rec');
    copy.name = (orig.name || 'Untitled') + ' copy';
    library.push(copy);
    openRecipe(copy);
    const n = document.getElementById('rec-name'); if(n){ n.focus(); n.select(); }
  }
}

function newFormula(type, opts){
  opts = opts || {};
  const f = mkFormula(type);
  f.name = '';
  if(opts.blank){ f.extras = []; f.notes = ''; }
  library.push(f);
  openFormula(f);
  const n = document.getElementById('formula-name'); if(n){ n.focus(); n.select(); }
}
function deleteFormula(id){
  const f = library.find(x=>x.id===id && x.kind==='formula');
  if(f && !confirm(`Delete formula "${formulaTitle(f)}"?`)) return;
  library = library.filter(x=>x.id!==id);
  linkFormulaPointers(); // resurrect a default if a whole dough type was removed; repoint state
  render();
  scheduleSave();
}

let libQuery = '';
function formulaSub(s){
  const bits = [ s.type, fmt(s.hydration) + '%' ];
  if(s.pfEnabled && s.pfMethod) bits.push(s.pfMethod);
  return bits.join(' · ');
}
function recipeSub(r){
  const bits = [];
  if((r.yield||'').trim()) bits.push(r.yield.trim());
  if(String(r.ovenTempF||'').trim()) bits.push('oven ' + r.ovenTempF + '°F');
  return bits.join(' · ') || 'recipe';
}
// ---------- tags ----------
function itemTags(it){ return Array.isArray(it && it.tags) ? it.tags : []; }
function allTags(){
  const seen = new Map(); // lowercase key -> first-seen display form
  library.forEach(it => itemTags(it).forEach(t => { const k = t.toLowerCase(); if(!seen.has(k)) seen.set(k, t); }));
  return [...seen.values()].sort((a,b) => a.localeCompare(b));
}
function addItemTag(it, raw){
  const t = (raw||'').trim().replace(/\s+/g,' ');
  if(!t) return false;
  if(!Array.isArray(it.tags)) it.tags = [];
  if(it.tags.some(x => x.toLowerCase() === t.toLowerCase())) return false; // dedupe, case-insensitive
  it.tags.push(t); return true;
}
function removeItemTag(it, tag){
  if(Array.isArray(it.tags)) it.tags = it.tags.filter(x => x.toLowerCase() !== tag.toLowerCase());
}
function renderTagEditor(containerId, item, onChange){
  const el = document.getElementById(containerId);
  if(!el) return;
  const tags = itemTags(item);
  const sugs = allTags().filter(t => !tags.some(x => x.toLowerCase() === t.toLowerCase()));
  el.innerHTML =
    `<div class="te-chips">` +
      tags.map(t => `<span class="te-chip" data-tag="${escapeHtml(t)}">${escapeHtml(t)}<span class="x" title="Remove">✕</span></span>`).join('') +
      `<input type="text" class="te-input" placeholder="${tags.length ? 'Add tag…' : 'Add a tag (e.g. Pizza, Cookies)'}" autocomplete="off" spellcheck="false" /></div>` +
    (sugs.length ? `<div class="te-sug">` + sugs.map(t => `<span class="s" data-tag="${escapeHtml(t)}">+ ${escapeHtml(t)}</span>`).join('') + `</div>` : '');
  const input = el.querySelector('.te-input');
  const commit = refocus => { onChange(); renderTagEditor(containerId, item, onChange); if(refocus){ const i = document.getElementById(containerId).querySelector('.te-input'); if(i) i.focus(); } };
  el.querySelectorAll('.te-chip .x').forEach(x => x.onclick = () => { removeItemTag(item, x.parentElement.getAttribute('data-tag')); commit(true); });
  el.querySelectorAll('.te-sug .s').forEach(s => s.onclick = () => { addItemTag(item, s.getAttribute('data-tag')); commit(true); });
  input.onkeydown = e => {
    if(e.key === 'Enter' || e.key === ','){ e.preventDefault(); const added = addItemTag(item, input.value); input.value = ''; if(added) commit(true); }
    else if(e.key === 'Backspace' && !input.value){ const cur = itemTags(item); if(cur.length){ removeItemTag(item, cur[cur.length-1]); commit(true); } }
  };
  input.onblur = () => { if(input.value.trim() && addItemTag(item, input.value)){ input.value = ''; commit(false); } };
}

let libTagFilter = '';
function renderTagFilter(){
  const el = document.getElementById('lib-tags');
  const tags = allTags();
  if(libTagFilter && !tags.some(t => t.toLowerCase() === libTagFilter.toLowerCase())) libTagFilter = ''; // stale filter
  el.classList.toggle('view-hidden', tags.length === 0);
  el.innerHTML = tags.map(t =>
    `<span class="tag-pill${libTagFilter && libTagFilter.toLowerCase() === t.toLowerCase() ? ' active' : ''}" data-tag="${escapeHtml(t)}">${escapeHtml(t)}</span>`
  ).join('');
  el.querySelectorAll('.tag-pill').forEach(p => p.onclick = () => {
    const t = p.getAttribute('data-tag');
    libTagFilter = (libTagFilter && libTagFilter.toLowerCase() === t.toLowerCase()) ? '' : t; // toggle
    renderLibrary();
  });
}
function tagMatch(it){ return !libTagFilter || itemTags(it).some(x => x.toLowerCase() === libTagFilter.toLowerCase()); }
function cardTagsHtml(it){
  const tags = itemTags(it);
  return tags.length ? `<div class="tags">${tags.map(t => `<span class="card-tag">${escapeHtml(t)}</span>`).join('')}</div>` : '';
}
function clearLibFilters(){
  libTagFilter = '';
  const i = document.getElementById('lib-q'); i.value = '';
  i.dispatchEvent(new Event('input',{bubbles:true})); // apply() -> libQuery='' + renderLibrary()
}

function libMatch(item){
  const q = libQuery.trim().toLowerCase();
  if(!q) return true;
  const base = item.kind === 'formula'
    ? formulaTitle(item) + ' ' + formulaSub(item)
    : (item.name || '') + ' ' + recipeSub(item);
  return (base + ' ' + itemTags(item).join(' ')).toLowerCase().includes(q);
}

function renderLibrary(){
  renderTagFilter();
  const fWrap = document.querySelector('#lib-formulas .lib-cards');
  const rWrap = document.querySelector('#lib-recipes .lib-cards');
  const q = libQuery.trim();
  const filtering = !!q || !!libTagFilter;
  const forms = formulaItems().filter(libMatch).filter(tagMatch);
  const recs  = recipeItems().filter(libMatch).filter(tagMatch);
  document.getElementById('count-formulas').textContent = forms.length ? '· ' + forms.length : '';
  document.getElementById('count-recipes').textContent  = recs.length  ? '· ' + recs.length  : '';

  // total miss while filtering: one unified message, both sections hidden
  const totalMiss = filtering && !forms.length && !recs.length;
  document.getElementById('lib-formulas').classList.toggle('view-hidden', totalMiss);
  document.getElementById('lib-recipes').classList.toggle('view-hidden', totalMiss);
  const nr = document.getElementById('lib-noresult');
  nr.classList.toggle('view-hidden', !totalMiss);
  if(totalMiss){
    const what = q ? `“${escapeHtml(q)}”` : `#${escapeHtml(libTagFilter)}`;
    nr.innerHTML = `<div class="em-h">Nothing matches ${what}.</div><div class="em-sub">Try a different filter, or clear it.</div><span class="em-act" data-act="clear-filters">Clear Filters</span>`;
    const c = nr.querySelector('[data-act="clear-filters"]');
    if(c) c.onclick = clearLibFilters;
    return;
  }

  const emptyF = filtering
    ? `<div class="lib-empty"><div class="em-h">No formulas match.</div></div>`
    : `<div class="lib-empty"><div class="em-h">No formulas yet.</div><div class="em-sub">Start one from a template.</div><span class="em-act" data-act="new-formula">+ New Formula</span></div>`;
  fWrap.innerHTML = forms.map(s =>
    `<div class="lib-card" data-id="${s.id}"><span class="nm">${escapeHtml(formulaTitle(s))}</span>${cardTagsHtml(s)}<span class="del" title="Delete">✕</span></div>`
  ).join('') || emptyF;

  const emptyR = filtering
    ? `<div class="lib-empty"><div class="em-h">No recipes match.</div></div>`
    : `<div class="lib-empty"><div class="em-h">No recipes yet.</div><div class="em-sub">Cookies, sauces, brines — anything that isn’t dough.</div><span class="em-act" data-act="new-recipe">+ New Recipe</span></div>`;
  rWrap.innerHTML = recs.map(r =>
    `<div class="lib-card" data-id="${r.id}"><span class="nm">${escapeHtml(r.name||'Untitled')}</span><span class="sub">${escapeHtml(recipeSub(r))}</span>${cardTagsHtml(r)}<span class="del" title="Delete">✕</span></div>`
  ).join('') || emptyR;

  fWrap.querySelectorAll('.lib-card').forEach(card => {
    const id = card.getAttribute('data-id');
    card.onclick = () => openFormula(library.find(x=>x.id===id));
    card.querySelector('.del').onclick = e => { e.stopPropagation(); deleteFormula(id); };
  });
  rWrap.querySelectorAll('.lib-card').forEach(card => {
    const id = card.getAttribute('data-id');
    card.onclick = () => openRecipe(library.find(x=>x.id===id));
    card.querySelector('.del').onclick = e => { e.stopPropagation(); deleteRecipe(id); };
  });
  const nf = fWrap.querySelector('[data-act="new-formula"]'); if(nf) nf.onclick = () => newFormula('pizza');
  const nrAct = rWrap.querySelector('[data-act="new-recipe"]'); if(nrAct) nrAct.onclick = () => newRecipe();
}

/* + New menu + header nav wiring */
document.getElementById('new-btn').onclick = e => {
  e.stopPropagation();
  document.getElementById('new-menu').classList.toggle('view-hidden');
};
document.querySelectorAll('#new-menu button').forEach(b => {
  b.onclick = () => {
    document.getElementById('new-menu').classList.add('view-hidden');
    const w = b.getAttribute('data-new');
    if(w === 'recipe') newRecipe();
    else if(w === 'blank') newFormula('pizza', {blank:true});
    else newFormula(w);
  };
});
document.addEventListener('click', e => {
  const wrap = document.querySelector('.new-wrap');
  if(wrap && !wrap.contains(e.target)) document.getElementById('new-menu').classList.add('view-hidden');
});
document.getElementById('pantry-btn').onclick = openPantry;
document.getElementById('detail-pantry-btn').onclick = openPantry;
document.getElementById('save-chip').onclick = openPantry; // jump to the Data File panel
document.getElementById('back-btn').onclick = goLibrary;
document.getElementById('dup-btn').onclick = duplicateActive;

/* library search */
(function(){
  const box = document.getElementById('lib-search');
  const input = document.getElementById('lib-q');
  const clear = document.getElementById('lib-q-clear');
  function apply(){
    libQuery = input.value;
    box.classList.toggle('has-q', !!libQuery.trim());
    if(screen === 'library') renderLibrary();
  }
  input.addEventListener('input', apply);
  clear.addEventListener('click', () => { input.value = ''; apply(); input.focus(); });
  input.addEventListener('keydown', e => { if(e.key === 'Escape'){ input.value = ''; apply(); input.blur(); } });
  document.addEventListener('keydown', e => {
    if(e.key !== '/' || screen !== 'library' || e.metaKey || e.ctrlKey || e.altKey) return;
    const tag = (document.activeElement && document.activeElement.tagName) || '';
    if(/^(INPUT|TEXTAREA|SELECT)$/.test(tag)) return;
    e.preventDefault(); input.focus();
  });
})();

function render(){
  updateViewVisibility();
  updateHeaderActions();
  if(screen === 'library') renderLibrary(); else renderAll();
  renderSaveChip();
}
function updateHeaderActions(){
  const lib = screen === 'library';
  document.getElementById('lib-actions').classList.toggle('view-hidden', !lib);
  document.getElementById('detail-actions').classList.toggle('view-hidden', lib);
  document.getElementById('dup-btn').classList.toggle('view-hidden', !(screen === 'formula' || screen === 'recipe')); // nothing to duplicate on pantry
  document.getElementById('detail-pantry-btn').classList.toggle('view-hidden', screen === 'pantry'); // already on pantry
  if(!lib) document.getElementById('new-menu').classList.add('view-hidden');
}
function updateViewVisibility(){
  const formula = screen === 'formula';
  const recipe = screen === 'recipe';
  const pantry = screen === 'pantry';
  const isLibrary = screen === 'library';
  document.getElementById('library-view').classList.toggle('view-hidden', !isLibrary);
  document.getElementById('main-grid').classList.toggle('view-hidden', isLibrary);
  // col-inputs children
  document.getElementById('recipe-view').classList.toggle('view-hidden', !formula);
  document.getElementById('pantry-view').classList.toggle('view-hidden', !pantry);
  document.getElementById('recipes-view').classList.toggle('view-hidden', !recipe);
  // ticket column holds the dough ticket OR the recipe card; hidden only for pantry
  document.getElementById('col-ticket').classList.toggle('view-hidden', pantry);
  document.getElementById('dough-ticket-wrap').classList.toggle('view-hidden', !formula);
  document.getElementById('recipe-card-wrap').classList.toggle('view-hidden', !recipe);
  document.getElementById('main-grid').classList.toggle('solo-view', pantry);
}

document.getElementById('show-line-costs').onchange = e => {
  showLineCosts = e.target.checked;
  renderTicket();
  scheduleSave();
};

document.getElementById('pf-enabled').onchange = e => {
  state[activeType].pfEnabled = e.target.checked;
  document.getElementById('pf-fields').classList.toggle('hidden', !e.target.checked);
  onChange();
};

document.getElementById('scrap-enabled').onchange = e => {
  scrapOn = e.target.checked;
  document.getElementById('scrap-pct-row').classList.toggle('hidden', !scrapOn);
  onChange();
};
document.getElementById('scrap-pct').oninput = e => {
  scrapPct = Math.max(0, +e.target.value || 0);
  onChange();
};

document.getElementById('pieces').oninput = e => { state[activeType].pieces = Math.max(1, +e.target.value || 1); onChange(); };
document.getElementById('wpp').oninput = e => { state[activeType].wpp = Math.max(1, +e.target.value || 1); onChange(); };
document.getElementById('f-flour').oninput = e => {
  const s = state[activeType];
  s.flour = Math.max(1, +e.target.value || 1);
  s.flourAuto = false;
  onChange(false);
};
document.getElementById('notes').oninput = e => { state[activeType].notes = e.target.value; onChange(false); };
document.getElementById('formula-name').oninput = e => { state[activeType].name = e.target.value; renderTicket(); scheduleSave(); };

function renderAll(){
  const s = state[activeType];
  document.getElementById('formula-name').value = s.name || s.recipeName || '';
  renderTagEditor('formula-tags', s, () => scheduleSave());
  document.getElementById('scrap-enabled').checked = scrapOn;
  document.getElementById('scrap-pct').value = scrapPct;
  document.getElementById('scrap-pct-row').classList.toggle('hidden', !scrapOn);
  document.getElementById('show-line-costs').checked = showLineCosts;
  syncFlour(s);
  renderPctFields();
  renderExtraFields();
  document.getElementById('pf-enabled').checked = s.pfEnabled;
  document.getElementById('pf-fields').classList.toggle('hidden', !s.pfEnabled);
  renderPfFields();
  renderScaleFields();
  renderNotes();
  renderTicket();
  renderPantryFields();
  renderAssemblyFields();
  renderRecipes();
}

/* Warn before leaving only when data would genuinely be lost — i.e. there are unsaved changes
   and nowhere they've been written (desktop with no file / lapsed permission, or a failed write).
   The device (localStorage) path saves reliably, so it never nags. */
window.addEventListener('beforeunload', (e) => {
  const atRisk = dirty && hasUserData() && HAS_FSA && (!fileHandle || lastError);
  if(atRisk){ e.preventDefault(); e.returnValue = ''; }
});
// keep the "last saved … ago" text current without a user action
setInterval(() => { renderSaveChip(); if(screen === 'pantry') refreshDatafileDetail(); }, 30000);

/* ---------- boot ---------- */
(function init(){
  render();
  if(HAS_FSA) tryReconnect();
  else initLocalStorage();
})();

})();
</script>
